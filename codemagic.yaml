workflows:
  ios-release:
    name: iOS App Store Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic
    environment:
      xcode: 16.4
      flutter: stable
      cocoapods: default
    scripts:
      - name: Disable Swift Package Manager (prevents Podfile auto-upgrade)
        script: flutter config --no-enable-swift-package-manager

      - name: Get Flutter dependencies
        script: flutter pub get

      - name: Run Flutter iOS migrations (no codesign)
        script: |
          set +o pipefail
          flutter build ios --release --no-codesign 2>&1 | tee /tmp/flutter_build_log.txt
          if ! grep -q "Xcode build done" /tmp/flutter_build_log.txt; then
            echo "=== Flutter iOS build genuinely failed (not just a signing check) ==="
            exit 1
          fi
          echo "=== Flutter migrations complete. ==="

      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files com.selfcarebloom.app \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
          # Extract the provisioning profile UUID for explicit use at build time
          PROFILE_UUID=$(find ~/Library/MobileDevice/Provisioning\ Profiles/ \
            -name "*.mobileprovision" -exec security cms -D -i {} \; 2>/dev/null \
            | grep -A1 '<key>UUID</key>' | grep '<string>' \
            | sed 's/.*<string>\(.*\)<\/string>.*/\1/' | head -1)
          echo "Profile UUID: $PROFILE_UUID"
          echo "$PROFILE_UUID" > /tmp/profile_uuid.txt

      - name: Build IPA
        script: |
          PROFILE_UUID=$(cat /tmp/profile_uuid.txt)
          echo "Using profile UUID: $PROFILE_UUID"
          xcode-project build-ipa \
            --workspace "ios/Runner.xcworkspace" \
            --scheme "Runner" \
            --archive-xcargs "CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY='Apple Distribution' DEVELOPMENT_TEAM=C26VK7Y2WB PROVISIONING_PROFILE_SPECIFIER=$PROFILE_UUID"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
