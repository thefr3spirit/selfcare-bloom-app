workflows:
  ios-release:
    name: iOS App Store Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic
    environment:
      xcode: 16.4
      flutter: stable
      cocoapods: default
    scripts:
      - name: Disable Swift Package Manager (prevents Podfile auto-upgrade)
        script: flutter config --no-enable-swift-package-manager

      - name: Get Flutter dependencies
        script: flutter pub get

      - name: Build iOS app without code signing (lets Flutter run all project migrations)
        script: |
          # Flutter 3.35+ exits with code 1 after --no-codesign builds because it runs a
          # post-build Development Team check even when signing is explicitly disabled.
          # The Xcode compilation itself succeeds. Pipe to tee so the pipeline exit code
          # is tee's (0), then verify "Xcode build done" appears before continuing.
          set +o pipefail
          flutter build ios --release --no-codesign 2>&1 | tee /tmp/flutter_build_log.txt
          if ! grep -q "Xcode build done" /tmp/flutter_build_log.txt; then
            echo "=== Flutter iOS build genuinely failed (not just a signing check) ==="
            exit 1
          fi
          echo "=== Flutter migrations complete. Proceeding to code signing. ==="

      - name: Set up iOS code signing (runs AFTER Flutter migrations)
        script: |
          keychain initialize
          app-store-connect fetch-signing-files com.selfcarebloom.app \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Archive and export IPA
        script: |
          # Build export_options.plist via PlistBuddy (no heredoc, no YAML issues).
          rm -f /tmp/export_options.plist
          /usr/libexec/PlistBuddy -c "Add :method string app-store" /tmp/export_options.plist
          /usr/libexec/PlistBuddy -c "Add :teamID string C26VK7Y2WB" /tmp/export_options.plist
          /usr/libexec/PlistBuddy -c "Add :signingStyle string manual" /tmp/export_options.plist
          /usr/libexec/PlistBuddy -c "Add :stripSwiftSymbols bool true" /tmp/export_options.plist
          /usr/libexec/PlistBuddy -c "Add :uploadSymbols bool true" /tmp/export_options.plist

          # Use flutter build ipa instead of manual xcodebuild archive + exportArchive.
          # flutter build ipa integrates archive + export in one command and correctly
          # uses the signing set up by xcode-project use-profiles above.
          # Migrations already ran in the prior step so they are skipped here.
          flutter build ipa \
            --release \
            --export-options-plist=/tmp/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
