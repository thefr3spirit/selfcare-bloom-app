workflows:
  ios-release:
    name: iOS App Store Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic
    environment:
      xcode: 16.4
      flutter: stable
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.selfcarebloom.app
    scripts:
      - name: Disable Swift Package Manager (prevents Podfile auto-upgrade)
        script: flutter config --no-enable-swift-package-manager

      - name: Get Flutter dependencies
        script: flutter pub get

      - name: Run Flutter iOS migrations (no codesign)
        script: |
          set +o pipefail
          flutter build ios --release --no-codesign 2>&1 | tee /tmp/flutter_build_log.txt
          if ! grep -q "Xcode build done" /tmp/flutter_build_log.txt; then
            echo "=== Flutter iOS build genuinely failed (not just a signing check) ==="
            exit 1
          fi
          echo "=== Flutter migrations complete. ==="

      - name: Re-apply code signing after Flutter migrations
        script: |
          xcode-project use-profiles
          echo "=== Detecting installed provisioning profile ==="
          PROFILE_NAME=""
          PROFILE_UUID=""
          for f in ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision; do
            PLIST=$(security cms -D -i "$f" 2>/dev/null)
            if echo "$PLIST" | grep -q "com.selfcarebloom.app"; then
              PROFILE_NAME=$(echo "$PLIST" | grep -A1 "<key>Name</key>" | grep "<string>" | sed 's/.*<string>\(.*\)<\/string>/\1/' | head -1)
              PROFILE_UUID=$(echo "$PLIST" | grep -A1 "<key>UUID</key>" | grep "<string>" | sed 's/.*<string>\(.*\)<\/string>/\1/' | head -1)
              echo "Found: Name='$PROFILE_NAME'  UUID='$PROFILE_UUID'"
              break
            fi
          done
          if [ -z "$PROFILE_NAME" ]; then
            echo "ERROR: No profile matching com.selfcarebloom.app found. Listing all profiles:"
            for f in ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision; do
              echo -n "  $f -> "; security cms -D -i "$f" 2>/dev/null | grep -A1 "<key>Name</key>" | grep "<string>" | sed 's/.*<string>\(.*\)<\/string>/\1/'
            done
            exit 1
          fi
          export CM_PROFILE_NAME="$PROFILE_NAME"
          export CM_PROFILE_UUID="$PROFILE_UUID"
          ruby << 'RUBY_SCRIPT'
          require 'xcodeproj'
          profile_name = ENV['CM_PROFILE_NAME']
          profile_uuid = ENV['CM_PROFILE_UUID']
          project = Xcodeproj::Project.open('ios/Runner.xcodeproj')
          project.targets.select { |t| t.name == 'Runner' }.each do |target|
            target.build_configurations.each do |config|
              # Remove any per-SDK CODE_SIGN_IDENTITY keys (xcodeproj may not replace them correctly)
              config.build_settings.reject! { |k, _| k.to_s.include?('CODE_SIGN_IDENTITY') && k.to_s.include?('sdk=') }
              config.build_settings['CODE_SIGN_STYLE']                    = 'Manual'
              config.build_settings['CODE_SIGN_IDENTITY']                 = 'Apple Distribution'
              config.build_settings['CODE_SIGN_IDENTITY[sdk=iphoneos*]']  = 'Apple Distribution'
              config.build_settings['DEVELOPMENT_TEAM']                   = 'C26VK7Y2WB'
              config.build_settings['PROVISIONING_PROFILE_SPECIFIER']     = profile_name
              config.build_settings['PROVISIONING_PROFILE']               = profile_uuid
            end
          end
          project.save
          puts "Done. Set profile: #{profile_name} (#{profile_uuid})"
          RUBY_SCRIPT
          echo "=== Sed: replace any residual iPhone Developer per-SDK overrides ==="
          sed -i '' '/CODE_SIGN_IDENTITY\[sdk=iphoneos/s/iPhone Developer/Apple Distribution/g' ios/Runner.xcodeproj/project.pbxproj
          echo "=== Final signing settings in project.pbxproj ==="
          grep -E "CODE_SIGN_STYLE|DEVELOPMENT_TEAM|PROVISIONING_PROFILE|CODE_SIGN_IDENTITY" ios/Runner.xcodeproj/project.pbxproj | head -30

      - name: Build IPA
        script: |
          # Use the export options plist generated by xcode-project use-profiles (has correct profile name)
          echo "=== Export options being used ==="
          cat /Users/builder/export_options.plist
          flutter build ipa \
            --release \
            --export-options-plist=/Users/builder/export_options.plist 2>&1 | tee /tmp/flutter_ipa_log.txt || {
            echo "=== BUILD FAILED — actual errors ==="
            grep -E "error:|Error" /tmp/flutter_ipa_log.txt | grep -v "note:" | tail -30
            exit 1
          }

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
