workflows:
  ios-release:
    name: iOS App Store Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic
    environment:
      xcode: 16.4
      flutter: stable
      cocoapods: default
    scripts:
      - name: Disable Swift Package Manager (prevents Podfile auto-upgrade)
        script: flutter config --no-enable-swift-package-manager

      - name: Get Flutter dependencies
        script: flutter pub get

      - name: Run Flutter iOS migrations (no codesign)
        script: |
          set +o pipefail
          flutter build ios --release --no-codesign 2>&1 | tee /tmp/flutter_build_log.txt
          if ! grep -q "Xcode build done" /tmp/flutter_build_log.txt; then
            echo "=== Flutter iOS build genuinely failed (not just a signing check) ==="
            exit 1
          fi
          echo "=== Flutter migrations complete. ==="

      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files com.selfcarebloom.app \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Build IPA
        script: |
          rm -f /tmp/export_options.plist
          /usr/libexec/PlistBuddy -c "Add :method string app-store" /tmp/export_options.plist
          /usr/libexec/PlistBuddy -c "Add :teamID string C26VK7Y2WB" /tmp/export_options.plist
          /usr/libexec/PlistBuddy -c "Add :signingStyle string manual" /tmp/export_options.plist
          /usr/libexec/PlistBuddy -c "Add :stripSwiftSymbols bool true" /tmp/export_options.plist
          /usr/libexec/PlistBuddy -c "Add :uploadSymbols bool true" /tmp/export_options.plist
          flutter build ipa \
            --release \
            --export-options-plist=/tmp/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
