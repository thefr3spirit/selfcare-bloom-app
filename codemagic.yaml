workflows:
  ios-release:
    name: iOS App Store Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic
    environment:
      xcode: latest
      flutter: stable
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.selfcarebloom.app
    scripts:
      - name: Disable Swift Package Manager (prevents Podfile auto-upgrade)
        script: flutter config --no-enable-swift-package-manager

      - name: Get Flutter dependencies
        script: flutter pub get

      - name: Precache Flutter iOS engine + fix Info.plist in engine cache (Xcode 26+)
        script: |
          flutter precache --ios
          # Use Generated.xcconfig for the authoritative FLUTTER_ROOT path.
          # (which flutter returns a symlink; dirname/dirname of the symlink is wrong)
          FLUTTER_SDK=$(grep "^FLUTTER_ROOT=" ios/Flutter/Generated.xcconfig | cut -d= -f2-)
          echo "Flutter SDK from Generated.xcconfig: $FLUTTER_SDK"
          if [ -z "$FLUTTER_SDK" ]; then
            FLUTTER_SDK=$(dirname $(dirname $(realpath $(which flutter) 2>/dev/null || readlink $(which flutter) || which flutter)))
            echo "Flutter SDK (fallback): $FLUTTER_SDK"
          fi
          FOUND=0
          find "$FLUTTER_SDK/bin/cache/artifacts/engine" -name "Flutter.framework" -type d 2>/dev/null | while IFS= read -r fw; do
            FOUND=$((FOUND+1))
            echo "Found: $fw"
            if [ ! -f "$fw/Info.plist" ]; then
              echo "  → Injecting Info.plist"
              /usr/libexec/PlistBuddy \
                -c "Add :CFBundleExecutable string Flutter" \
                -c "Add :CFBundleIdentifier string io.flutter.flutter" \
                -c "Add :CFBundleInfoDictionaryVersion string 6.0" \
                -c "Add :CFBundleName string Flutter" \
                -c "Add :CFBundlePackageType string FMWK" \
                -c "Add :CFBundleShortVersionString string 1.0" \
                -c "Add :CFBundleVersion string 1" \
                -c "Add :MinimumOSVersion string 15.0" \
                "$fw/Info.plist" && echo "  → Done"
            else
              echo "  → Already has Info.plist"
            fi
          done
          echo "Engine cache patch complete (found $FOUND framework(s))"

      - name: Generate Hive adapters (build_runner)
        script: dart run build_runner build --delete-conflicting-outputs

      - name: Run Flutter iOS migrations (no codesign)
        script: |
          set +o pipefail
          flutter build ios --release --no-codesign 2>&1 | tee /tmp/flutter_build_log.txt
          if ! grep -q "Xcode build done" /tmp/flutter_build_log.txt; then
            echo "=== Flutter iOS build genuinely failed (not just a signing check) ==="
            exit 1
          fi
          echo "=== Flutter migrations complete. ==="

      - name: Fix Flutter.framework Info.plist in ios/Flutter (post-assemble, Xcode 26+)
        script: |
          # flutter build ios --no-codesign (above) runs flutter assemble which symlinks or
          # copies Flutter.xcframework into ios/Flutter/. Patch the framework slices here so
          # the Info.plist is present when flutter build ipa archives.
          echo "=== Searching ios/Flutter for Flutter.framework slices ==="
          find ios/Flutter -name "Flutter.framework" -type d 2>/dev/null | while IFS= read -r fw; do
            echo "Found: $fw"
            if [ ! -f "$fw/Info.plist" ]; then
              echo "  → Injecting Info.plist"
              /usr/libexec/PlistBuddy \
                -c "Add :CFBundleExecutable string Flutter" \
                -c "Add :CFBundleIdentifier string io.flutter.flutter" \
                -c "Add :CFBundleInfoDictionaryVersion string 6.0" \
                -c "Add :CFBundleName string Flutter" \
                -c "Add :CFBundlePackageType string FMWK" \
                -c "Add :CFBundleShortVersionString string 1.0" \
                -c "Add :CFBundleVersion string 1" \
                -c "Add :MinimumOSVersion string 15.0" \
                "$fw/Info.plist" && echo "  → Done: $fw/Info.plist"
            else
              echo "  → Already has Info.plist"
            fi
          done

      - name: Re-apply code signing after Flutter migrations
        script: |
          xcode-project use-profiles
          echo "=== Deleting all per-SDK CODE_SIGN_IDENTITY overrides (prevents duplicate-key conflicts) ==="
          sed -i '' '/CODE_SIGN_IDENTITY\[sdk=iphoneos/d' ios/Runner.xcodeproj/project.pbxproj
          echo "=== Final signing settings in project.pbxproj ==="
          grep -E "CODE_SIGN_STYLE|DEVELOPMENT_TEAM|PROVISIONING_PROFILE|CODE_SIGN_IDENTITY" ios/Runner.xcodeproj/project.pbxproj | head -30

      - name: Build IPA
        script: |
          echo "=== Export options being used ==="
          cat /Users/builder/export_options.plist
          flutter build ipa \
            --release \
            --export-options-plist=/Users/builder/export_options.plist 2>&1 | tee /tmp/flutter_ipa_log.txt || {
            echo "=============================="
            echo "=== BUILD FAILED ==="
            echo "=============================="
            echo "--- Error lines from flutter output ---"
            grep -iE "error:|xcode error|no profile|no matching|code sign|archive failed|could not find" /tmp/flutter_ipa_log.txt | grep -v "^    note:" | head -40 || echo "(grep found no matching error lines — scroll up in this log for context)"
            echo "--- Raw xcodebuild log files ---"
            for f in /tmp/xcodebuild_logs/*.log ~/Library/Logs/gym/*.log; do
              [ -f "$f" ] && { echo "=== $f ==="; grep -iE "error:|archive failed|code sign|no profile" "$f" | head -40; }
            done 2>/dev/null || echo "No xcodebuild log files found"
            echo "=============================="
            exit 1
          }

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
