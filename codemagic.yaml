workflows:
  ios-release:
    name: iOS App Store Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic
    environment:
      xcode: latest
      flutter: stable
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.selfcarebloom.app
    scripts:
      - name: Disable Swift Package Manager (prevents Podfile auto-upgrade)
        script: flutter config --no-enable-swift-package-manager

      - name: Get Flutter dependencies
        script: flutter pub get

      - name: Precache Flutter iOS engine + patch Info.plist in engine cache (Xcode 26+)
        script: |
          flutter precache --ios
          FLUTTER_SDK=$(grep "^FLUTTER_ROOT=" ios/Flutter/Generated.xcconfig | cut -d= -f2-)
          echo "Flutter SDK: ${FLUTTER_SDK:-NOT FOUND}"
          if [ -z "$FLUTTER_SDK" ]; then
            FLUTTER_SDK=$(dirname $(dirname $(realpath $(which flutter) 2>/dev/null || which flutter)))
            echo "Flutter SDK (fallback): $FLUTTER_SDK"
          fi

          # Write a known-good Info.plist to a temp file (avoids heredoc/YAML indentation issues)
          printf '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0"><dict>\n  <key>CFBundleExecutable</key><string>Flutter</string>\n  <key>CFBundleIdentifier</key><string>io.flutter.flutter</string>\n  <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>\n  <key>CFBundleName</key><string>Flutter</string>\n  <key>CFBundlePackageType</key><string>FMWK</string>\n  <key>CFBundleShortVersionString</key><string>1.0</string>\n  <key>CFBundleVersion</key><string>1</string>\n  <key>MinimumOSVersion</key><string>15.0</string>\n</dict></plist>\n' > /tmp/flutter_info.plist
          echo "Template plist: $(wc -c < /tmp/flutter_info.plist) bytes"

          # find -L follows symlinks — critical because engine cache may use symlinked dirs
          echo "=== Scanning engine cache (following symlinks) ==="
          find -L "$FLUTTER_SDK/bin/cache/artifacts/engine" -name "Flutter.framework" -type d 2>/dev/null > /tmp/fw_list.txt
          echo "Found $(wc -l < /tmp/fw_list.txt | tr -d ' ') Flutter.framework(s):"
          cat /tmp/fw_list.txt

          while IFS= read -r fw; do
            echo "--- $fw"
            ls "$fw/" 2>/dev/null | head -5
            if [ ! -f "$fw/Info.plist" ]; then
              chmod u+w "$fw" && echo "  chmod OK" || echo "  chmod FAILED (continuing)"
              cp /tmp/flutter_info.plist "$fw/Info.plist" && echo "  PATCHED" || echo "  WRITE FAILED"
              [ -f "$fw/Info.plist" ] && echo "  VERIFIED: $(wc -c < "$fw/Info.plist") bytes" || echo "  ERROR: file missing after write!"
            else
              echo "  Already has Info.plist"
            fi
          done < /tmp/fw_list.txt
          echo "=== Engine cache patch complete ==="

      - name: Generate Hive adapters (build_runner)
        script: dart run build_runner build --delete-conflicting-outputs

      - name: Run Flutter iOS migrations (no codesign)
        script: |
          set +o pipefail
          flutter build ios --release --no-codesign 2>&1 | tee /tmp/flutter_build_log.txt
          if ! grep -q "Xcode build done" /tmp/flutter_build_log.txt; then
            echo "=== Flutter iOS build genuinely failed (not just a signing check) ==="
            exit 1
          fi
          echo "=== Flutter migrations complete. ==="

      - name: Patch Info.plist in ios/Flutter (post-assemble, Xcode 26+)
        script: |
          # find -L follows symlinks; cp from template is more reliable than PlistBuddy
          echo "=== Scanning ios/Flutter for Flutter.framework slices (following symlinks) ==="
          find -L ios/Flutter -name "Flutter.framework" -type d 2>/dev/null > /tmp/ios_fw_list.txt
          echo "Found $(wc -l < /tmp/ios_fw_list.txt | tr -d ' ') framework(s):"
          cat /tmp/ios_fw_list.txt

          while IFS= read -r fw; do
            echo "--- $fw"
            ls "$fw/" 2>/dev/null | head -5
            if [ ! -f "$fw/Info.plist" ]; then
              chmod u+w "$fw" && echo "  chmod OK" || echo "  chmod FAILED (continuing)"
              cp /tmp/flutter_info.plist "$fw/Info.plist" && echo "  PATCHED" || echo "  WRITE FAILED"
              [ -f "$fw/Info.plist" ] && echo "  VERIFIED: $(wc -c < "$fw/Info.plist") bytes" || echo "  ERROR: file missing after write!"
            else
              echo "  Already has Info.plist"
            fi
          done < /tmp/ios_fw_list.txt
          echo "=== ios/Flutter patch complete ==="

      - name: Re-apply code signing after Flutter migrations
        script: |
          xcode-project use-profiles
          echo "=== Deleting all per-SDK CODE_SIGN_IDENTITY overrides (prevents duplicate-key conflicts) ==="
          sed -i '' '/CODE_SIGN_IDENTITY\[sdk=iphoneos/d' ios/Runner.xcodeproj/project.pbxproj
          echo "=== Final signing settings in project.pbxproj ==="
          grep -E "CODE_SIGN_STYLE|DEVELOPMENT_TEAM|PROVISIONING_PROFILE|CODE_SIGN_IDENTITY" ios/Runner.xcodeproj/project.pbxproj | head -30

      - name: Build IPA (xcodebuild direct — bypasses Flutter Info.plist validation)
        script: |
          echo "=== Overwriting export_options.plist (clean — app only, no frameworks) ==="
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0"><dict>' \
            '  <key>method</key><string>app-store</string>' \
            '  <key>teamID</key><string>C26VK7Y2WB</string>' \
            '  <key>signingStyle</key><string>manual</string>' \
            '  <key>signingCertificate</key><string>Apple Distribution</string>' \
            '  <key>provisioningProfiles</key>' \
            '  <dict>' \
            '    <key>com.selfcarebloom.app</key><string>newselfcare</string>' \
            '  </dict>' \
            '  <key>stripSwiftSymbols</key><true/>' \
            '  <key>uploadSymbols</key><true/>' \
            '  <key>uploadBitcode</key><false/>' \
            '</dict></plist>' \
            > /Users/builder/export_options.plist
          echo "=== Export options being used ==="
          cat /Users/builder/export_options.plist

          echo "=== Archiving ==="
          # -derivedDataPath forces a FRESH build directory so xcodebuild re-processes
          # Flutter.xcframework from scratch (uses our patched copy with Info.plist),
          # rather than reusing DerivedData built by the earlier flutter build --no-codesign
          # step which ran before we patched the framework.
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -sdk iphoneos \
            -configuration Release \
            -archivePath /tmp/Runner.xcarchive \
            -derivedDataPath /tmp/xcodebuild_derived_data \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=C26VK7Y2WB \
            PROVISIONING_PROFILE_SPECIFIER=newselfcare \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PRODUCT_BUNDLE_IDENTIFIER=com.selfcarebloom.app \
            | xcpretty --color || {
              echo "=== xcodebuild archive FAILED — raw errors ==="
              xcodebuild archive \
                -workspace ios/Runner.xcworkspace \
                -scheme Runner \
                -sdk iphoneos \
                -configuration Release \
                -archivePath /tmp/Runner.xcarchive \
                -derivedDataPath /tmp/xcodebuild_derived_data \
                CODE_SIGN_STYLE=Manual \
                DEVELOPMENT_TEAM=C26VK7Y2WB \
                PROVISIONING_PROFILE_SPECIFIER=newselfcare \
                CODE_SIGN_IDENTITY="Apple Distribution" \
                PRODUCT_BUNDLE_IDENTIFIER=com.selfcarebloom.app 2>&1 | grep -iE "error:|warning:.*error|no profile|code sign|archive failed" | head -60
              exit 1
            }

          echo "=== Exporting IPA ==="
          mkdir -p build/ios/ipa
          xcodebuild -exportArchive \
            -archivePath /tmp/Runner.xcarchive \
            -exportOptionsPlist /Users/builder/export_options.plist \
            -exportPath build/ios/ipa \
            -allowProvisioningUpdates || {
              echo "=== exportArchive FAILED ==="
              cat /tmp/Runner.xcarchive/Info.plist 2>/dev/null || true
              exit 1
            }

          echo "=== IPA built ==="
          ls -lh build/ios/ipa/

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/ipa/**/*.ipa
      - /tmp/Runner.xcarchive/Products/Applications/*.app

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
