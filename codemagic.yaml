workflows:
  ios-release:
    name: iOS App Store Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic
    environment:
      xcode: 16.4
      flutter: stable
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.selfcarebloom.app
    scripts:
      - name: Disable Swift Package Manager (prevents Podfile auto-upgrade)
        script: flutter config --no-enable-swift-package-manager

      - name: Get Flutter dependencies
        script: flutter pub get

      - name: Run Flutter iOS migrations (no codesign)
        script: |
          set +o pipefail
          flutter build ios --release --no-codesign 2>&1 | tee /tmp/flutter_build_log.txt
          if ! grep -q "Xcode build done" /tmp/flutter_build_log.txt; then
            echo "=== Flutter iOS build genuinely failed (not just a signing check) ==="
            exit 1
          fi
          echo "=== Flutter migrations complete. ==="

      - name: Re-apply code signing after Flutter migrations
        script: |
          xcode-project use-profiles
          echo "=== Actual installed provisioning profile names ==="
          for f in ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision; do
            echo -n "$f -> "; security cms -D -i "$f" 2>/dev/null | grep -A1 "<key>Name</key>" | grep "<string>" | sed 's/.*<string>\(.*\)<\/string>/\1/'
          done
          echo "=== Signing settings set by use-profiles ==="
          grep -E "CODE_SIGN_STYLE|DEVELOPMENT_TEAM|PROVISIONING_PROFILE_SPECIFIER|CODE_SIGN_IDENTITY" ios/Runner.xcodeproj/project.pbxproj | head -20 || echo "WARNING: No signing settings set"
          echo "=== Ensuring CODE_SIGN_STYLE and DEVELOPMENT_TEAM via xcodeproj gem ==="
          ruby << 'RUBY_SCRIPT'
          require 'xcodeproj'
          project = Xcodeproj::Project.open('ios/Runner.xcodeproj')
          project.targets.select { |t| t.name == 'Runner' }.each do |target|
            target.build_configurations.each do |config|
              config.build_settings['CODE_SIGN_STYLE'] = 'Manual'
              config.build_settings['CODE_SIGN_IDENTITY'] = 'Apple Distribution'
              config.build_settings['DEVELOPMENT_TEAM'] = 'C26VK7Y2WB'
              # PROVISIONING_PROFILE_SPECIFIER is set by xcode-project use-profiles (reads actual profile name)
            end
          end
          project.save
          puts 'Done.'
          RUBY_SCRIPT
          echo "=== Final signing settings in project.pbxproj ==="
          grep -E "CODE_SIGN_STYLE|DEVELOPMENT_TEAM|PROVISIONING_PROFILE_SPECIFIER|CODE_SIGN_IDENTITY" ios/Runner.xcodeproj/project.pbxproj | head -20

      - name: Build IPA
        script: |
          rm -f /tmp/export_options.plist
          /usr/libexec/PlistBuddy -c "Add :method string app-store" /tmp/export_options.plist
          /usr/libexec/PlistBuddy -c "Add :teamID string C26VK7Y2WB" /tmp/export_options.plist
          /usr/libexec/PlistBuddy -c "Add :signingStyle string manual" /tmp/export_options.plist
          /usr/libexec/PlistBuddy -c "Add :signingCertificate string Apple Distribution" /tmp/export_options.plist
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" /tmp/export_options.plist
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:com.selfcarebloom.app string newselfcarep" /tmp/export_options.plist
          flutter build ipa \
            --release \
            --export-options-plist=/tmp/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
