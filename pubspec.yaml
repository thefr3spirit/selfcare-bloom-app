name: selfcare_together
description: Offline-first stress management app for mental health pilot study
publish_to: 'none'
version: 1.0.0+20

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  firebase_messaging: ^16.0.0
  cloud_functions: ^6.0.0
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.4
  crypto: ^3.0.3
  
  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2
  
  # Charts for stress trend visualization
  fl_chart: ^0.65.0
  
  # Local notifications
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2
  
  # CSV export
  csv: ^6.0.0
  
  # Share functionality
  share_plus: ^7.2.1
  
  # URL launcher for mailto links and WhatsApp
  url_launcher: ^6.2.2
  
  # Permissions
  permission_handler: ^11.1.0
  
  # Device info for unique device IDs
  device_info_plus: ^9.1.0
  
  # Date formatting
  intl: ^0.18.1
  
  # Icons
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  
  # Code generation for Hive
  hive_generator: ^2.0.1
  build_runner: ^2.4.7
  
  # App icon generator
  flutter_launcher_icons: ^0.13.1

# App Icon Configuration
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/pictures/logo.jpg"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/pictures/logo.jpg"
  # Note: For best results, the foreground image should have 20-25% padding
  # on all sides to ensure the logo isn't cropped by different device shapes

flutter:
  uses-material-design: true
  
  # Assets
  assets:
    - assets/pictures/logo.jpg
    - assets/pictures/google.png
  
  # Add fonts if needed later
  # fonts:
  #   - family: Roboto
  #     fonts:
  #       - asset: fonts/Roboto-Regular.ttf
