name: iOS TestFlight Release

# Manual trigger only — every run attempts a real App Store Connect upload,
# and each one consumes a build number, so this shouldn't fire on every push.
on:
  workflow_dispatch:

jobs:
  build-and-upload:
    # Pinned to an older, more mature Xcode generation (not macos-latest's
    # Xcode 26.6 default) — both xcodebuild's destination:upload and altool
    # (which fastlane pilot also shells out to) fail against a provably
    # valid IPA via Xcode 26.6's ContentDelivery.framework specifically.
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: 'stable'

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Generate Hive adapters (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Verify generated files exist
        run: |
          echo "Looking for *.g.dart files under lib/:"
          find lib -name "*.g.dart"
          test -f lib/models/user_profile.g.dart || (echo "::error::user_profile.g.dart was not generated" && exit 1)

      - name: Install App Store Connect API key
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$API_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
          python3 -c "import json, os; json.dump({'key_id': os.environ['KEY_ID'], 'issuer_id': os.environ['ISSUER_ID'], 'key': os.environ['API_KEY_P8'], 'duration': 1200, 'in_house': False}, open(os.path.expanduser('~/appstoreconnect_api_key.json'), 'w'))"

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install --repo-update

      - name: Archive (automatic signing via API key)
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/ios/archive/Runner.xcarchive \
            -destination 'generic/platform=iOS' \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Inspect archived binary (diagnostic)
        run: |
          BINARY="build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app/Runner"
          echo "--- ls -la ---"
          ls -la "$BINARY" || echo "FILE MISSING"
          echo "--- file ---"
          file "$BINARY" || true
          echo "--- lipo -info ---"
          lipo -info "$BINARY" || true
          echo "--- codesign -dv ---"
          codesign -dv "$BINARY" 2>&1 || true

      - name: Export IPA (local only, no upload yet)
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist ios/ExportOptions-ci.plist \
            -exportPath build/ios/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Inspect exported IPA binary (diagnostic)
        run: |
          IPA=$(find build/ios/export -name '*.ipa' | head -n1)
          echo "IPA path: $IPA"
          ls -la "$IPA"
          shasum -a 256 "$IPA"
          mkdir -p /tmp/ipa-check
          unzip -q "$IPA" -d /tmp/ipa-check
          BINARY=$(find /tmp/ipa-check/Payload -maxdepth 2 -type f -perm -u+x | head -n1)
          echo "Binary path: $BINARY"
          ls -la "$BINARY"
          file "$BINARY"
          lipo -info "$BINARY"
          codesign -dv "$BINARY" 2>&1 || true
          echo "--- packaged Info.plist CFBundleIdentifier ---"
          PLIST=$(find /tmp/ipa-check/Payload -maxdepth 2 -name 'Info.plist' | head -n1)
          echo "Plist path: $PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PLIST" || true
          echo "--- full plist dump ---"
          plutil -p "$PLIST" || true

      - name: Inspect EVERY binary in the bundle (diagnostic)
        run: |
          echo "Scanning all Mach-O binaries under Runner.app for architecture + signing info..."
          echo "Per TN3117 (Apple Developer Support's own pointer, case 20000144564960):"
          echo "on an Apple Silicon build host, an XCFramework's ios-arm64-simulator slice"
          echo "and its ios-arm64 (device) slice both report as plain 'arm64' to lipo -info,"
          echo "so a wrong-slice embed would pass every check we've run so far. Checking the"
          echo "actual platform tag (LC_BUILD_VERSION) of every binary to rule that out."
          SIM_FOUND=0
          find /tmp/ipa-check/Payload/Runner.app -type f | while IFS= read -r f; do
            if file "$f" | grep -q "Mach-O"; then
              echo "=== $f ==="
              lipo -info "$f" 2>&1
              codesign -dv "$f" 2>&1
              codesign --verify --strict "$f" 2>&1 && echo "codesign --verify: OK" || echo "codesign --verify: FAILED"
              echo "--- platform (vtool) ---"
              xcrun vtool -show-build "$f" 2>&1
            fi
          done
          echo ""
          echo "--- codesign --verify --deep --strict on the whole app bundle ---"
          codesign --verify --deep --strict --verbose=4 /tmp/ipa-check/Payload/Runner.app 2>&1
          echo ""
          echo "--- SUMMARY: any binary tagged as IOSSIMULATOR platform? (this would be the bug) ---"
          find /tmp/ipa-check/Payload/Runner.app -type f -exec sh -c 'file "$1" | grep -q Mach-O && xcrun vtool -show-build "$1" 2>&1 | grep -q "platform IOSSIMULATOR" && echo "SIMULATOR SLICE FOUND: $1"' _ {} \;
          echo "(if nothing printed above this line, no simulator-platform binaries were found)"

      - name: Inspect entitlements and provisioning profile (diagnostic)
        run: |
          echo "--- Entitlements baked into the signed Runner binary ---"
          codesign -d --entitlements :- /tmp/ipa-check/Payload/Runner.app/Runner 2>&1
          echo ""
          echo "--- Embedded provisioning profile entitlements ---"
          PROFILE=/tmp/ipa-check/Payload/Runner.app/embedded.mobileprovision
          if [ -f "$PROFILE" ]; then
            security cms -D -i "$PROFILE" > /tmp/profile.plist 2>&1
            echo "Profile name / UUID / team / expiry:"
            /usr/libexec/PlistBuddy -c "Print :Name" /tmp/profile.plist || true
            /usr/libexec/PlistBuddy -c "Print :UUID" /tmp/profile.plist || true
            /usr/libexec/PlistBuddy -c "Print :TeamIdentifier" /tmp/profile.plist || true
            /usr/libexec/PlistBuddy -c "Print :ExpirationDate" /tmp/profile.plist || true
            echo ""
            echo "Full Entitlements dict from profile:"
            /usr/libexec/PlistBuddy -c "Print :Entitlements" /tmp/profile.plist || true
          else
            echo "NO embedded.mobileprovision found in the app bundle!"
          fi
          echo ""
          echo "--- Disk space on runner (ruling out truncation from low space) ---"
          df -h /

      - name: Install fastlane
        run: gem install fastlane -N

      - name: Upload to TestFlight via fastlane pilot
        continue-on-error: true
        run: |
          echo "--- All .ipa files under build/ios/export ---"
          find build/ios/export -name '*.ipa' -exec ls -la {} \;
          IPA=$(find build/ios/export -name '*.ipa' | head -n1)
          echo "--- Selected IPA for upload ---"
          echo "$IPA"
          shasum -a 256 "$IPA"
          fastlane pilot upload \
            --ipa "$IPA" \
            --api_key_path "$HOME/appstoreconnect_api_key.json" \
            --skip_waiting_for_build_processing true \
            --skip_submission true

      - name: Upload to TestFlight via iTMSTransporter (alternative tool, different code path than altool)
        if: always()
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          IPA=$(find build/ios/export -name '*.ipa' | head -n1)
          echo "Uploading $IPA via iTMSTransporter..."
          xcrun iTMSTransporter -m upload \
            -assetFile "$IPA" \
            -apiKey "$KEY_ID" \
            -apiIssuer "$ISSUER_ID"

      - name: Upload build artifacts (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-output
          path: |
            build/ios/archive/Runner.xcarchive/Info.plist
            build/ios/export/**
          if-no-files-found: ignore
          retention-days: 7
