name: iOS TestFlight Release

# Manual trigger only — every run attempts a real App Store Connect upload,
# and each one consumes a build number, so this shouldn't fire on every push.
on:
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: 'stable'

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Generate Hive adapters (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Verify generated files exist
        run: |
          echo "Looking for *.g.dart files under lib/:"
          find lib -name "*.g.dart"
          test -f lib/models/user_profile.g.dart || (echo "::error::user_profile.g.dart was not generated" && exit 1)

      - name: Install App Store Connect API key
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$API_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
          # Also write a JSON key file for fastlane pilot (used for the actual upload)
          python3 -c "
import json, os
data = {
    'key_id': os.environ['KEY_ID'],
    'issuer_id': os.environ['ISSUER_ID'],
    'key': os.environ['API_KEY_P8'],
    'duration': 1200,
    'in_house': False,
}
with open(os.path.expanduser('~/appstoreconnect_api_key.json'), 'w') as f:
    json.dump(data, f)
"

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install --repo-update

      - name: Archive (automatic signing via API key)
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/ios/archive/Runner.xcarchive \
            -destination 'generic/platform=iOS' \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Inspect archived binary (diagnostic)
        run: |
          BINARY="build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app/Runner"
          echo "--- ls -la ---"
          ls -la "$BINARY" || echo "FILE MISSING"
          echo "--- file ---"
          file "$BINARY" || true
          echo "--- lipo -info ---"
          lipo -info "$BINARY" || true
          echo "--- codesign -dv ---"
          codesign -dv "$BINARY" 2>&1 || true

      - name: Export IPA (local only, no upload yet)
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist ios/ExportOptions-ci.plist \
            -exportPath build/ios/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Inspect exported IPA binary (diagnostic)
        run: |
          IPA=$(find build/ios/export -name '*.ipa' | head -n1)
          echo "IPA path: $IPA"
          ls -la "$IPA"
          mkdir -p /tmp/ipa-check
          unzip -q "$IPA" -d /tmp/ipa-check
          BINARY=$(find /tmp/ipa-check/Payload -maxdepth 2 -type f -perm -u+x | head -n1)
          echo "Binary path: $BINARY"
          ls -la "$BINARY"
          file "$BINARY"
          lipo -info "$BINARY"
          codesign -dv "$BINARY" 2>&1 || true
          echo "--- packaged Info.plist CFBundleIdentifier ---"
          PLIST=$(find /tmp/ipa-check/Payload -maxdepth 2 -name 'Info.plist' | head -n1)
          echo "Plist path: $PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PLIST" || true
          echo "--- full plist dump ---"
          plutil -p "$PLIST" || true

      - name: Install fastlane
        run: gem install fastlane -N

      - name: Upload to TestFlight via fastlane pilot
        run: |
          IPA=$(find build/ios/export -name '*.ipa' | head -n1)
          fastlane pilot upload \
            --ipa "$IPA" \
            --api_key_path "$HOME/appstoreconnect_api_key.json" \
            --skip_waiting_for_build_processing true \
            --skip_submission true

      - name: Upload build artifacts (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-output
          path: |
            build/ios/archive/Runner.xcarchive/Info.plist
            build/ios/export/**
          if-no-files-found: ignore
          retention-days: 7
